services:
  - type: web
    name: scriptoria
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 2 app:app
    envVars:
      - key: GROQ_API_KEY
        sync: false        # set manually in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
      # VITE_API_URL must NOT be set here — empty means same-origin (relative URLs)
      # Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the Render dashboard
